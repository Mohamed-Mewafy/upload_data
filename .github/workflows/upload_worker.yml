name: CimaSpace Auto Uploader

on:
  workflow_dispatch: # يتيح لك التشغيل اليدوي بضغطة زر من GitHub
  schedule:
    - cron: '0 */6 * * *' # يعمل تلقائياً كل 6 ساعات

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests internetarchive supabase playwright yt-dlp
          playwright install chromium
          sudo apt-get install -y ffmpeg

      - name: Run Uploader Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          python main.py
